# The CLI is half the quickstart: `ghostgpu up` is how a fleet gets declared, so
# shipping only the operator image left the tutorial requiring a clone.
version: 2

project_name: ghostgpu

before:
  hooks:
    - go mod tidy

builds:
  - id: ghostgpu
    main: ./cmd/ghostgpu
    binary: ghostgpu
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # No Windows on ARM: nobody is running a Kubernetes test harness there,
      # and an untested binary is worse than an absent one.
      - goos: windows
        goarch: arm64
    # ldflags are GoReleaser's defaults, which write main.version, main.commit
    # and main.date. Task 2 named those symbols to match.

archives:
  - id: ghostgpu
    # Version is deliberately omitted: GitHub's stable "latest" endpoint is
    # releases/latest/download/<exact-filename>, so a versioned filename means
    # every release breaks every documented curl command. This is the only
    # moment that change is free.
    name_template: "ghostgpu_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# mode: append means GoReleaser creates the release if one doesn't exist yet
# and only adds assets to it thereafter, rather than owning it outright. But
# with disable: false and no draft setting, GoReleaser's release would become
# user-visible as soon as it finishes uploading — BEFORE the chart is pushed,
# the installer is generated, or release notes are written. Any later
# workflow failure would then leave a public, incomplete release on a tag
# that cannot be re-cut. draft: true keeps it hidden; the workflow's
# softprops/action-gh-release step (which defaults draft to false) publishes
# it at the very end, once every asset and the real notes are in place.
release:
  disable: false
  mode: append
  draft: true

changelog:
  disable: true
