site_name: ghostgpu
site_description: Simulate GPU clusters on Kubernetes — test GPU-aware schedulers with zero GPU hardware
site_url: https://santimillang.github.io/ghostgpu/
repo_url: https://github.com/santimillang/ghostgpu
repo_name: santimillang/ghostgpu
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# The design notes and spike findings stay in the repository — they are
# engineering evidence, and code comments cite them by path — but they are
# working documents, not documentation, so they are kept out of the published
# site. Pages that reference them link to GitHub instead.
exclude_docs: |
  design/
  requirements.txt

theme:
  name: material
  logo: assets/ghostgpu.svg
  favicon: assets/ghostgpu.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Simulating hardware:
      - MIG: simulating/mig.md
      - Faults: simulating/faults.md
      - Occupancy: simulating/occupancy.md
      - Metrics: simulating/metrics.md
  - Tools:
      - ghostgpu capture: tools/capture.md
      - ghostgpu status: tools/status.md
  - Scenarios: scenarios.md
  - Reference:
      - Fidelity contract: reference/fidelity.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/santimillang/ghostgpu
