name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Versions are pinned deliberately: e2e asserts behavior of real upstream
      # components, so drift must surface as a tracked change, not silent rot.
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kwokctl
        run: |
          curl -Lo ./kwokctl https://github.com/kubernetes-sigs/kwok/releases/download/v0.8.0/kwokctl-linux-$(go env GOARCH)
          chmod +x ./kwokctl
          sudo mv ./kwokctl /usr/local/bin/kwokctl

      - name: Verify tool installation
        run: |
          kind version
          kwokctl --version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
