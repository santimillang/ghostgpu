# Publishes the documentation site to the gh-pages branch.
#
# Nothing else lives on that branch: the Helm chart is published only as an
# OCI artifact on ghcr, deliberately, so this deploy owns gh-pages outright
# and there is no other publisher to clobber.
#
# If a classic `helm repo add` index is ever added back, it would land on
# this same branch — Pages serves exactly one source — and this deploy would
# need `keep_files: true`, or it would silently unpublish the chart
# repository with no failing build to notice.
name: Docs

on:
  # Deploys only when something that affects the site actually changed.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # Deliberately NOT path-filtered. `docs` is a required status check on main,
  # and a required check that never runs is never reported, which leaves every
  # pull request touching only code permanently blocked on a pending status.
  # The build takes about fifteen seconds, so running it always is cheaper than
  # the trap.
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Read-only, and the required status check. This job runs on pull requests
  # from forks, so it must hold no write access: it installs a third-party
  # package from PyPI, and a compromised release of that package would
  # otherwise be handed a token that can push to this repository.
  build:
    name: docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Version-pinned so a theme upgrade cannot change the published site
      # without a commit explaining why. Not hash-pinned: that would be worth
      # doing when this job held a write token, which is exactly what the split
      # above removed.
      - name: Install mkdocs-material
        run: pip install -r docs/requirements.txt

      # --strict fails the build on a broken internal link or a page missing
      # from the nav. Docs that lie are the specific failure this project
      # spends effort avoiding, and a dead link is the cheapest kind of lie.
      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site/
          retention-days: 1

  # Write access lives here, and this job never runs on a pull request. It does
  # not check out or execute repository code — it only publishes the artifact
  # the build job produced.
  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
