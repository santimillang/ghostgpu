# Publishes a release: a multi-arch image and a single-file installer.
#
# The two together are what make the quickstart honest. Until now the only way
# to run ghostgpu was to clone it and build, which is a wall for anyone
# evaluating it in the ten minutes they have.
name: Release

on:
  push:
    tags:
      - "v*"
  # Buildable on demand without tagging, so the workflow itself can be verified
  # before it is trusted with a real release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v0.1.0-test"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Aligned with every other workflow, and the one that most needs it: this
      # is the only job holding contents, packages, id-token and attestations
      # write. fetch-depth 0 because GoReleaser documents needing full history
      # and tags to resolve a version, and a shallow clone only warns.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is only appended on a real tag push. A workflow_dispatch dry
      # run still pushes for real (see "Verify the signature we just made"
      # below for why that's deliberate) but must not move :latest onto a
      # throwaway build — that's the one part of the dry run CONTRIBUTING.md
      # promises does not publish.
      - name: Compute image tags
        id: tags
        run: |
          tags="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            tags="$tags"$'\n'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Multi-arch because a good share of the people who would evaluate a
      # laptop-scale simulator are on arm64 Macs.
      - name: Build and push the manager image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.tags }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity, so
      # there is no key to store, rotate, or leak. Signs the digest, not the
      # tag, because a tag can move and a signature over a mutable reference
      # proves nothing.
      - name: Sign the image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attest the image build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A signing story nobody has verified is a claim, not a control. No
      # event guard here: workflow_dispatch pushes the image for real (the
      # build step above has no guard either), so this is the only place the
      # dry run rehearses the thing an admission policy would actually check.
      - name: Verify the signature we just made
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # GoReleaser's `sboms: archive` config shells out to syft, which is not
      # preinstalled on ubuntu-latest. Without this, GoReleaser errors here —
      # AFTER the image is pushed, :latest is moved, and a cosign signature is
      # written to the immutable public Rekor log — leaving a half-made public
      # release on a tag that can never be re-cut.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # release: draft: true in .goreleaser.yaml, so this creates the release
      # in a draft state; softprops/action-gh-release publishes it at the end
      # once the chart, installer, and notes are all ready. mode: append means
      # it adds assets to the draft the publish step later un-drafts, rather
      # than owning the release outright.
      - name: Build the CLI archives
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only on a real release: a workflow_dispatch snapshot build isn't
      # published, so there is nothing at these paths worth a provenance
      # claim tied to a release that doesn't exist.
      - name: Attest the CLI archives
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip"

      # The chart's version and the operator it deploys are both the tag: one
      # release, one number, nothing for a user to correlate.
      #
      # Runs after GoReleaser for the same reason the installer does: --clean
      # empties dist/, and packaging first would have the .tgz deleted before
      # it could be published. build-installer below only ever adds to dist/
      # (mkdir -p, then a single file write), so this step and that one can
      # share the directory safely regardless of order between themselves.
      - name: Package and push the chart
        id: chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SEMVER="${VERSION#v}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

          make helm helm-tool
          ./bin/helm package charts/ghostgpu \
            --version "$SEMVER" --app-version "$VERSION" \
            --destination dist/

          if [ "${{ github.event_name }}" = "push" ]; then
            ./bin/helm push "dist/ghostgpu-${SEMVER}.tgz" \
              oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
          else
            echo "dry run: packaged but not pushed"
          fi

      # Pinned to the immutable tag rather than :latest, so an installer
      # downloaded today keeps deploying the version it was built against.
      #
      # Runs after GoReleaser: GoReleaser's --clean empties dist/, so
      # generating the installer first would have it deleted before publish.
      - name: Generate the installer
        run: |
          make build-installer \
            IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      # Deliberately not `kubectl apply --dry-run=client`: that needs to reach an
      # API server to resolve resource kinds, so with no cluster here it fails
      # on every document regardless of whether the file is good. A parse plus a
      # check that the pieces are present is what can honestly be verified
      # offline; the installer is exercised for real by the e2e job.
      - name: Check the installer parses and is complete
        run: |
          python3 - <<'PY'
          import sys, yaml

          docs = [d for d in yaml.safe_load_all(open("dist/install.yaml")) if d]
          kinds = [d.get("kind") for d in docs]

          print(f"{len(docs)} documents: {sorted(set(kinds))}")

          for required in ("CustomResourceDefinition", "Deployment", "ServiceAccount", "ClusterRole"):
              if required not in kinds:
                  sys.exit(f"installer is missing a {required}")

          if kinds.count("CustomResourceDefinition") != 2:
              sys.exit("expected both the GPUModel and GPUPool CRDs")
          PY

      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/install.yaml
            dist/ghostgpu-*.tgz
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/install.yaml
            ```

            Or with Helm:

            ```sh
            helm install ghostgpu oci://ghcr.io/${{ github.repository_owner }}/charts/ghostgpu \
              --version ${{ steps.chart.outputs.semver }} \
              --namespace ghostgpu-system --create-namespace
            ```

            ## Verify

            ```sh
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            ghostgpu only ever modifies nodes carrying kwok's
            `kwok.x-k8s.io/node` annotation, so it is safe to install in a
            cluster that also contains real GPU hardware.

      - name: Upload the installer for a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            dist/install.yaml
            dist/ghostgpu-*.tgz
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
