# A classic Helm repository alongside the OCI one. OCI is the modern path, but
# plenty of tooling and plenty of humans still reach for `helm repo add`, and
# being absent from that path is a complaint we can avoid for the cost of an
# index file.
name: Chart Pages

on:
  # Deliberately a tag push, NOT `release: [published]`. The GitHub Release is
  # created by release.yml using secrets.GITHUB_TOKEN, and GitHub does not
  # trigger workflow runs from GITHUB_TOKEN events — a `release` trigger here
  # would simply never fire, leaving the documented `helm repo add` path
  # permanently 404.
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  index:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # chart-releaser packages whatever Chart.yaml is committed, which on main
      # is 0.0.0-dev. Only release.yml rewrites it, and only for the OCI path —
      # so without this step the published chart would deploy
      # ghcr.io/santimillang/ghostgpu:0.0.0-dev, an image tag that will never
      # exist, and every `helm repo add` user would get ImagePullBackOff.
      #
      # Same split as the OCI path: chart version is SemVer with no leading v,
      # appVersion is the tag as written.
      - name: Stamp the chart version from the tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          SEMVER="${VERSION#v}"

          sed -i "s/^version: .*/version: ${SEMVER}/" charts/ghostgpu/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: ${VERSION}/" charts/ghostgpu/Chart.yaml

          echo "packaging chart ${SEMVER} (appVersion ${VERSION})"
          grep -E "^(version|appVersion):" charts/ghostgpu/Chart.yaml

      - name: Publish the chart to the gh-pages index
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          # chart-releaser cuts its own GitHub Release per chart version and
          # marks it "latest" by default. That would hijack
          # releases/latest/download/... out from under the two install commands
          # at the top of the README — including the CLI archive URL, whose
          # entire design is that it never changes. The release cut by
          # release.yml is the one that must stay latest.
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
