apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ghostgpu
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ghostgpu
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ghostgpu
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: ghostgpu
    spec:
      # kwokctl cordons the one real node in a `kwokctl create cluster --runtime
      # kind` cluster, so simulated workload lands on simulated nodes rather
      # than on the machine hosting them.
      #
      # The ghostgpu operator is not simulated. It is a real Deployment that
      # needs a real node, and the cluster the quickstart tells people to create
      # has exactly one — the cordoned one. Without this toleration the operator
      # sits Pending forever and every documented install appears to hang, which
      # is what a first-time user actually met before this was added.
      #
      # Tolerating the taint is safe: it only says a cordoned node is still
      # somewhere this may run. A controller that keeps no local state has
      # nothing to lose by running on a node marked for drain.
      tolerations:
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      # ...but never onto a simulated node. `kwokctl scale node` creates fake
      # nodes with NO taint, so nothing otherwise stops the scheduler putting
      # the operator on one — and a kwok node executes nothing. The pod is
      # reported Running, its container never starts, it reconciles nothing and
      # its logs are unreachable. That is strictly worse than Pending, which is
      # at least visibly broken.
      #
      # Two terms because they are ORed: a real node usually carries no `type`
      # label at all, and `NotIn` does not match a key that is absent, so
      # `DoesNotExist` is what covers ordinary nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: DoesNotExist
              - matchExpressions:
                  - key: type
                    operator: NotIn
                    values:
                      - kwok
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        # DCGM-shaped metrics for the simulated fleet, on dcgm-exporter's
        # conventional port so an existing scrape config finds them unchanged.
        - containerPort: 9400
          name: gpu-metrics
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        # The exporter watches Pods, Nodes, ResourceClaims and ResourceSlices
        # cluster-wide. The kubebuilder default of 128Mi is sized for a
        # controller watching a handful of its own CRs, not for the
        # thousand-node fleets this project exists to simulate, and the first
        # person to scale-test it would have met an OOMKill. The Pod cache is
        # also stripped to labels only (see cmd/main.go).
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 128Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
