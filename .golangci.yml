version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
        - newexpr
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # gosec is enabled for G109: a narrowing conversion of parsed external
      # data, which is what silently reproduced a fleet of the wrong size when
      # a node label carried an oversized gpu.count. G115 is the same idea
      # applied to slice lengths and already-bounded arithmetic, where the
      # conversion cannot overflow and the guard it wants fights the modernize
      # linter over min/max. Excluded deliberately, and narrowly.
      - linters:
          - gosec
        text: G115
      # Test code runs kubectl by design (G204) and embeds fixture strings that
      # pattern-match as credentials (G101). Neither is a finding about the
      # operator that ships.
      - linters:
          - gosec
        path: (_test\.go|^test/)
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
