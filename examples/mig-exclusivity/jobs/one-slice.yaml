# Asks for the smallest slice of the same card. It is published as a device and
# looks allocatable, but the whole-card job has consumed the counters it draws
# on — so the scheduler cannot realise it, and says so by leaving the pod
# Pending.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: one-slice-claim
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: ghostgpu-mig-example
          count: 1
          allocationMode: ExactCount
          selectors:
            - cel:
                expression: device.attributes["gpu.ghostgpu.dev"].migProfile == "1g.10gb"
---
apiVersion: v1
kind: Pod
metadata:
  name: one-slice
spec:
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: inference
      image: fake-inference:latest
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimName: one-slice-claim
