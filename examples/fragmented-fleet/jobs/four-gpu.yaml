# A job needing four GPUs on one node.
#
# Applied separately from the fleet, because the point is to submit it against
# a cluster that is already in a particular state. `kubectl apply -f` does not
# recurse into subdirectories, so applying the scenario directory sets up the
# fleet without submitting this.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: frag-4gpu-claim
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: ghostgpu-example
          count: 4
          allocationMode: ExactCount
---
apiVersion: v1
kind: Pod
metadata:
  name: frag-4gpu
spec:
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: trainer
      image: fake-trainer:latest
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimName: frag-4gpu-claim
