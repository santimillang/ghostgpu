# Two jobs, each holding one GPU. The `workload` label is what selects their
# utilisation profile — the notebook's presence in the pool's workloads list is
# the only reason it reports differently.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: trainer-claim
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: ghostgpu-idle-example
          count: 1
          allocationMode: ExactCount
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer
  labels:
    workload: trainer
spec:
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: trainer
      image: fake-trainer:latest
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimName: trainer-claim
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: notebook-claim
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: ghostgpu-idle-example
          count: 1
          allocationMode: ExactCount
---
apiVersion: v1
kind: Pod
metadata:
  name: notebook
  labels:
    workload: notebook
spec:
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: notebook
      image: fake-notebook:latest
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimName: notebook-claim
