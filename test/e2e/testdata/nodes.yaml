# Simulated nodes for the e2e suite.
#
# ghost-e2e-0 and ghost-e2e-1 carry the kwok.x-k8s.io/node annotation, so kwok
# drives their lifecycle and ghostgpu is permitted to modify them.
#
# ghost-e2e-real deliberately does NOT carry that annotation while still
# matching the pool's nodeSelector. It stands in for a production GPU node in a
# cluster where ghostgpu was installed by mistake, and the suite asserts it is
# never touched.
apiVersion: v1
kind: Node
metadata:
  name: ghost-e2e-0
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
    kwok.x-k8s.io/node: fake
  labels:
    beta.kubernetes.io/arch: amd64
    beta.kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: ghost-e2e-0
    kubernetes.io/os: linux
    kubernetes.io/role: agent
    node-role.kubernetes.io/agent: ""
    type: kwok
spec:
  taints:
    - effect: NoSchedule
      key: kwok.x-k8s.io/node
      value: fake
status:
  allocatable:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  capacity:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  nodeInfo:
    architecture: amd64
    containerRuntimeVersion: containerd://fake
    kubeletVersion: fake
    operatingSystem: linux
  phase: Running
---
apiVersion: v1
kind: Node
metadata:
  name: ghost-e2e-1
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
    kwok.x-k8s.io/node: fake
  labels:
    beta.kubernetes.io/arch: amd64
    beta.kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: ghost-e2e-1
    kubernetes.io/os: linux
    kubernetes.io/role: agent
    node-role.kubernetes.io/agent: ""
    type: kwok
spec:
  taints:
    - effect: NoSchedule
      key: kwok.x-k8s.io/node
      value: fake
status:
  allocatable:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  capacity:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  nodeInfo:
    architecture: amd64
    containerRuntimeVersion: containerd://fake
    kubeletVersion: fake
    operatingSystem: linux
  phase: Running
---
apiVersion: v1
kind: Node
metadata:
  name: ghost-e2e-real
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
  labels:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: ghost-e2e-real
    kubernetes.io/os: linux
    type: kwok
spec:
  taints:
    - effect: NoSchedule
      key: node.kubernetes.io/unreachable
status:
  allocatable:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  capacity:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  nodeInfo:
    architecture: amd64
    containerRuntimeVersion: containerd://fake
    kubeletVersion: fake
    operatingSystem: linux
