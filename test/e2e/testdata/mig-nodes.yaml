# A 16-GPU node for the MIG suite.
#
# Sixteen rather than eight is deliberate. The 8-counter-sets-per-slice limit
# means a 16-GPU pool needs two counter slices, so this is the only fixture that
# exercises the scheduler resolving a counter set declared in a slice other than
# the first. An 8-GPU node would pass every assertion here while leaving that
# path untested.
apiVersion: v1
kind: Node
metadata:
  name: ghost-mig-0
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
    kwok.x-k8s.io/node: fake
  labels:
    beta.kubernetes.io/arch: amd64
    beta.kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: ghost-mig-0
    kubernetes.io/os: linux
    kubernetes.io/role: agent
    node-role.kubernetes.io/agent: ""
    type: mig
spec:
  taints:
    - effect: NoSchedule
      key: kwok.x-k8s.io/node
      value: fake
status:
  allocatable:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  capacity:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  nodeInfo:
    architecture: amd64
    containerRuntimeVersion: containerd://fake
    kubeletVersion: fake
    operatingSystem: linux
  phase: Running
