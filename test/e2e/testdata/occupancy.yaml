# A deliberately fragmented fleet: four nodes, 4 GPUs each, unevenly full.
#
#   rack-a: 2 busy -> 2 free   (x2 nodes)
#   rack-b: 2 busy -> 2 free
#   rack-c: 3 busy -> 1 free
#
# Seven GPUs are free across sixteen, but no node has more than two. A four-GPU
# job must therefore stay Pending even though the cluster has room for it in
# aggregate — which is the scheduling question this feature exists to ask.
apiVersion: ghostgpu.dev/v1alpha1
kind: GPUModel
metadata:
  name: occupancy-h100
spec:
  vendor: nvidia
  productName: NVIDIA-H100-80GB-HBM3
  memory: 80Gi
  computeCapability: "9.0"
---
apiVersion: ghostgpu.dev/v1alpha1
kind: GPUPool
metadata:
  name: occupancy-pool
spec:
  modelRef: occupancy-h100
  nodeSelector:
    type: occupancy
  gpusPerNode: 4
  occupancy:
    # Ordering is meaningful: entries are first-match-wins, so the specific
    # racks precede the selector-less default.
    - nodeSelector:
        rack: c
      busyPerNode: 3
    - busyPerNode: 2
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: ghostgpu-occupancy-e2e
spec:
  selectors:
    - cel:
        expression: device.driver == "gpu.ghostgpu.dev"
---
apiVersion: v1
kind: Node
metadata:
  name: ghost-frag-a0
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: ghost-frag-a0
    kubernetes.io/os: linux
    type: occupancy
    rack: a
spec:
  taints:
    - effect: NoSchedule
      key: kwok.x-k8s.io/node
      value: fake
status:
  allocatable: {cpu: "96", memory: 1024Gi, pods: "110"}
  capacity: {cpu: "96", memory: 1024Gi, pods: "110"}
  nodeInfo:
    architecture: amd64
    containerRuntimeVersion: containerd://fake
    kubeletVersion: fake
    operatingSystem: linux
  phase: Running
---
