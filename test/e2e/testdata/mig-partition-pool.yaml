# A statically partitioned pool: each GPU carries one 3g.40gb and four 1g.10gb.
#
# That is 3 + 4 = 7 compute slices and 40Gi + 4x10Gi = 80Gi, exactly one H100.
# Choosing a layout that fills the card exactly is deliberate: it is the case
# where an off-by-one in the budget arithmetic would show up.
apiVersion: ghostgpu.dev/v1alpha1
kind: GPUModel
metadata:
  name: h100-static
spec:
  vendor: nvidia
  productName: NVIDIA-H100-80GB-HBM3
  memory: 80Gi
  computeCapability: "9.0"
---
apiVersion: ghostgpu.dev/v1alpha1
kind: GPUPool
metadata:
  name: static-pool
spec:
  modelRef: h100-static
  nodeSelector:
    type: static-mig
  gpusPerNode: 2
  sharingMode: mig
  migPartition:
    - profile: 3g.40gb
      count: 1
    - profile: 1g.10gb
      count: 4
---
apiVersion: v1
kind: Node
metadata:
  name: ghost-static-0
  annotations:
    node.alpha.kubernetes.io/ttl: "0"
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: ghost-static-0
    kubernetes.io/os: linux
    type: static-mig
spec:
  taints:
    - effect: NoSchedule
      key: kwok.x-k8s.io/node
      value: fake
status:
  allocatable:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  capacity:
    cpu: "96"
    memory: 1024Gi
    pods: "110"
  nodeInfo:
    architecture: amd64
    containerRuntimeVersion: containerd://fake
    kubeletVersion: fake
    operatingSystem: linux
  phase: Running
