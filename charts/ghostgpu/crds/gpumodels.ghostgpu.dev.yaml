apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gpumodels.ghostgpu.dev
spec:
  group: ghostgpu.dev
  names:
    kind: GPUModel
    listKind: GPUModelList
    plural: gpumodels
    singular: gpumodel
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.productName
      name: Product
      type: string
    - jsonPath: .spec.memory
      name: Memory
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GPUModel is the Schema for the gpumodels API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GPUModel
            properties:
              computeCapability:
                description: computeCapability of the GPU, e.g. "9.0".
                pattern: ^[0-9]+\.[0-9]+$
                type: string
              memory:
                anyOf:
                - type: integer
                - type: string
                description: memory available per GPU, e.g. "80Gi".
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              migBudget:
                description: "migBudget is what one physical GPU can hand out in total.\n\
                  \nDefaults to this model's own memory and the slice count of the\
                  \ built-in\ntable. Deriving memory from the model rather than the\
                  \ table matters for\nhardware that shares a family but not a capacity\
                  \ \u2014 an H100 NVL carries\n94GB, and inheriting the 80GB table\
                  \ budget would simulate a card the\nuser did not ask for."
                properties:
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: memory available to MIG instances. Defaults to the
                      model's memory.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  slices:
                    default: 7
                    description: 'slices is the total compute slices on the GPU. NVIDIA
                      MIG hardware

                      exposes seven.'
                    format: int32
                    maximum: 8
                    minimum: 1
                    type: integer
                type: object
              migProfiles:
                description: 'migProfiles are the MIG instance shapes this GPU can
                  be partitioned into.


                  Leave empty to use ghostgpu''s built-in table for the productName,
                  which

                  is what NVIDIA publishes for that hardware. Set it only for GPUs

                  ghostgpu does not recognise, or to restrict a known GPU to a subset.'
                items:
                  description: MIGProfileSpec is one MIG instance shape and what it
                    draws from its GPU.
                  properties:
                    memory:
                      anyOf:
                      - type: integer
                      - type: string
                      description: memory this instance reserves from the GPU's framebuffer.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    name:
                      description: 'name as NVIDIA reports it, e.g. "1g.10gb". This
                        becomes part of the DRA

                        device name and of an extended resource name under the mixed
                        strategy,

                        so it must be a valid resource name segment.'
                      pattern: ^[0-9]+g\.[0-9]+gb$
                      type: string
                    slices:
                      description: slices is the number of compute slices consumed.
                      format: int32
                      maximum: 8
                      minimum: 1
                      type: integer
                  required:
                  - memory
                  - name
                  - slices
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              productName:
                description: 'productName as reported by GPU Feature Discovery, e.g.
                  "NVIDIA-H100-SXM".

                  This is surfaced verbatim in the nvidia.com/gpu.product node label,
                  so it

                  must match what real GFD would report for tooling to select on it.'
                minLength: 1
                type: string
              vendor:
                default: nvidia
                description: vendor of the simulated GPU.
                enum:
                - nvidia
                type: string
            required:
            - computeCapability
            - memory
            - productName
            type: object
          status:
            description: status defines the observed state of GPUModel
            properties:
              conditions:
                description: 'conditions represent the current state of the GPUModel
                  resource.

                  Each condition has a unique type and reflects the status of a specific
                  aspect of the resource.


                  Standard condition types include:

                  - "Available": the resource is fully functional

                  - "Progressing": the resource is being created or updated

                  - "Degraded": the resource failed to reach or maintain its desired
                  state


                  The status of each condition is one of True, False, or Unknown.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition
                        transitioned from one status to another.

                        This should be when the underlying condition changed.  If
                        that is not known, then using the time when the API field
                        changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating
                        details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation
                        that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but
                        the .status.conditions[x].observedGeneration is 9, the condition
                        is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating
                        the reason for the condition''s last transition.

                        Producers of specific condition types may define expected
                        values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
